name: inbox-check
# Daily dry run, so a file dropped in the inbox is seen within a day.
# Writes nothing. The log is public, so it prints counts only.
#
# Environment "prod-check" has no required reviewer. Give it a service account
# that can only view the register and the inbox folder.
#
# Runs daily at 05:30 UTC, and by hand.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: prod-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
      - run: uv python install 3.12
      - run: uv sync --locked
      - env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IAA_REGISTER_SHEET_ID: ${{ vars.IAA_REGISTER_SHEET_ID }}
          IAA_INBOX_FOLDER_ID: ${{ vars.IAA_INBOX_FOLDER_ID }}
          IAA_ENVIRONMENT: prod
        run: uv run iaa register reconcile --dry-run
