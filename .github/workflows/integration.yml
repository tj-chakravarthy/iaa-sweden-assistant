name: integration
# Runs tests/test_live.py on a dev spreadsheet. See docs/dev-register.md.
# Environment "dev": a service account that can edit only the dev sheet.
# The test deletes and rebuilds tabs there and refuses a sheet without "dev" in its title.
# Synthetic data only. Missing configuration or skipped required tests fail this job.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/integration.yml"]
permissions:
  contents: read
concurrency: integration # one run at a time on the dev sheet
jobs:
  live:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev
      - env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IAA_DEV_SHEET_ID: ${{ vars.IAA_DEV_SHEET_ID }}
          IAA_DEV_INBOX_FOLDER_ID: ${{ vars.IAA_DEV_INBOX_FOLDER_ID }}
        run: uv run pytest tests/test_live.py --require-live -q -rs
