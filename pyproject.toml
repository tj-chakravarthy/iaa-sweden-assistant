[project]
name = "iaa-sweden-assistant"
version = "0.1.0"
description = "Member-register assistant for INSEAD Alumni Association Sweden: reconciles INSEAD, payments, Eventbrite and Mailchimp data into one register with human approval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "gspread>=6.1,<7",
    "google-auth>=2.30",
    "google-api-python-client>=2.130",
    "requests>=2.32",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0"]
dev = ["pytest>=8.2", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
iaa = "iaa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iaa"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
